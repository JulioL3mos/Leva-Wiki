services:
  mongodb:
    image: mongo:latest
    container_name: leva_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: leva_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=LEVA_DB
      - JWT_SECRET=sua_chave_secreta_aqui_em_producao
      # Update FRONTEND_URL to the actual domain or IP of the server in production
      - FRONTEND_URL=http://localhost
    volumes:
      # Mount the uploads directory to persist uploaded files locally on the host
      - backend_uploads:/app/uploads
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: leva_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  mongodb_data:
  backend_uploads:
